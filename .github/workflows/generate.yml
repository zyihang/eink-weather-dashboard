name: Generate Daily Weather Image

on:
  schedule:
    # 每天 UTC 22:30 (北京时间每天 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 用系统自带 git 拉取代码，不依赖任何 actions/checkout，彻底告别 Node.js 报错
      - name: 原生拉取代码
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: 安装 Python 运行环境与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行生成脚本
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
        run: python generate.py

      - name: 原生推送到 gh-pages 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 创建独立的网页分支
          git checkout --orphan gh-pages
          
          # 清理代码源文件，仅保留打包生成的预览图与固件
          git rm -rf .
          mv output_preview.png weather.png
          git add -f weather.png weather.bin
          
          git commit -m "Auto-update weather dashboard [skip ci]"
          git push -f origin gh-pages
