name: Generate Daily Weather Image

on:
  schedule:
    # 每天北京时间 06:30、12:30、18:30 各自动运行一次
    # UTC 时间对应的分别是: 22:30(前一天), 04:30, 10:30
    - cron: '30 22,4,10 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面上手动点击 "Run workflow"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 原生拉取代码
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: 安装 Python 依赖与中文字体 (Noto Sans CJK + borax 农历库)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk python3-pip
          python3 -m pip install --upgrade pip
          # 注意：这里加入了 borax 历法库
          python3 -m pip install requests pillow borax

      - name: 运行生成脚本并生成图片
        env:
          # 从仓库 Variables 中读取配置（兼容 Secrets 回退）
          QWEATHER_KEY: ${{ vars.QWEATHER_KEY || secrets.QWEATHER_KEY }}
          QWEATHER_HOST: ${{ vars.QWEATHER_HOST || secrets.QWEATHER_HOST }}
          LOCATION_ID: ${{ vars.LOCATION_ID }}
        run: python3 generate.py

      - name: 检查文件生成情况
        run: |
          echo "=== 检查本地生成的图片文件 ==="
          ls -lh latest.png || echo "❌ 警告: latest.png 并不存在！"

      - name: 提交图片到仓库
        run: |
          git add -f latest.png archive/
          if git diff --staged --quiet; then
            echo "⚠️ 暂存区无变动，跳过提交"
          else
            git commit -m "自动更新天气与万年历图片 [skip ci]"
            CURRENT_BRANCH=$(git branch --show-current)
            [ -z "$CURRENT_BRANCH" ] && CURRENT_BRANCH="main"
            git push origin HEAD:${CURRENT_BRANCH}
            echo "=== ✅ 图片与归档文件夹提交成功 ==="
          fi
