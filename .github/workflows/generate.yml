name: Generate Daily Weather Image

on:
  schedule:
    # 每天 UTC 22:30 (北京时间每天 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 原生拉取代码
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: 安装 Python 运行环境与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行生成脚本
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
        run: |
          python generate.py
          # 验证文件是否真的生成成功并打印文件大小
          ls -lh output_preview.png weather.bin

      - name: 原生推送到 gh-pages 分支
        run: |
          # 1. 先把生成的重要文件安全转移到系统临时目录
          cp output_preview.png /tmp/weather.png
          cp weather.bin /tmp/weather.bin

          # 2. 配置 Git 信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 3. 切换到干净的孤立分支
          git checkout --orphan gh-pages
          git rm -rf .

          # 4. 把文件从临时目录移回仓库根目录
          cp /tmp/weather.png ./weather.png
          cp /tmp/weather.bin ./weather.bin
          
          # 创建 .nojekyll，防止 GitHub Pages 过滤文件
          touch .nojekyll

          # 5. 强制添加并提交
          git add -f weather.png weather.bin .nojekyll
          git status
          git commit -m "Auto-update weather dashboard [skip ci]"
          git push -f origin gh-pages
