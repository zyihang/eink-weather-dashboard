name: Generate Daily Weather Image

on:
  schedule:
    # 每天 UTC 22:30 (北京时间每天 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 原生拉取代码
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: 安装依赖与字体
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev fonts-noto-cjk python3-pip
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      - name: 运行生成脚本
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
        run: python3 generate.py

      - name: 检查文件生成情况
        run: |
          echo "=== 检查本地文件 ==="
          ls -lh latest.png || echo "❌ 警告: latest.png 并不存在！"
          ls -lh archive/ || echo "❌ 警告: archive 目录不存在！"

      - name: 提交图片到仓库
        run: |
          # 1. 强制添加，防止 .gitignore 拦截图片
          git add -f latest.png archive/

          # 2. 检查暂存区并提交推送到当前分支
          if git diff --staged --quiet; then
            echo "⚠️ 暂存区无变动（图片无变化）"
          else
            git commit -m "自动更新天气图片 [skip ci]"
            # 获取当前分支名并推送
            CURRENT_BRANCH=$(git branch --show-current)
            [ -z "$CURRENT_BRANCH" ] && CURRENT_BRANCH="main"
            git push origin HEAD:${CURRENT_BRANCH}
            echo "=== ✅ 图片与日期文件夹提交成功 ==="
          fi
