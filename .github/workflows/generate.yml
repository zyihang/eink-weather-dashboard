name: Generate Daily Weather Image

on:
  schedule:
    # 每天 UTC 22:30 (即北京时间每天早上 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch: # 支持手动点击测试

# 配置 GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.1.7 的完整 40位 SHA
      - name: 检出代码
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: 安装 Python 与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行生成脚本
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
        run: python generate.py

      - name: 整理输出文件夹
        run: |
          mkdir dist
          cp output_preview.png dist/weather.png
          cp weather.bin dist/weather.bin

      # actions/upload-pages-artifact@v3.0.1 的完整 40位 SHA
      - name: 上传构建产物至 Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/deploy-pages@v4.0.5 的完整 40位 SHA
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
