name: Generate Daily Weather Image

on:
  schedule:
    # 每天 UTC 22:30 (即北京时间每天早上 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点按钮测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行生成脚本
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
        run: python generate.py

      - name: 整理输出文件夹
        run: |
          mkdir dist
          cp output_preview.png dist/weather.png
          cp weather.bin dist/weather.bin

      - name: 自动发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
