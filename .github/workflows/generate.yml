name: Generate Daily Weather Image

on:
  schedule:
    # 每天 UTC 22:30 (北京时间每天 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 原生拉取代码
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: 安装 Python 依赖、Cairo 渲染器与顶级中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行生成脚本
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
        run: python generate.py

      - name: 提交图片到仓库
        run: |
          # 仅暂存图片和归档文件夹
          git add latest.png archive/
          
          if git diff --staged --quiet; then
            echo "图片无变动，跳过提交"
          else
            git commit -m "自动更新天气图片 [skip ci]"
            git push origin HEAD
            echo "=== 图片与日期文件夹提交成功 ==="
          fi
